<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Flockville raven crest</title>
  <desc id="desc">A sculpted raven head in a metallic violet and gold shield.</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8e6ab"/><stop offset=".18" stop-color="#b99b62"/><stop offset=".42" stop-color="#66507c"/>
      <stop offset=".67" stop-color="#e4d1f6"/><stop offset=".82" stop-color="#6b4d8c"/><stop offset="1" stop-color="#b5975d"/>
    </linearGradient>
    <linearGradient id="shield" x1=".2" y1="0" x2=".8" y2="1">
      <stop stop-color="#55426c"/><stop offset=".35" stop-color="#241b36"/><stop offset="1" stop-color="#0b101d"/>
    </linearGradient>
    <linearGradient id="head" x1=".1" y1="0" x2=".8" y2="1">
      <stop stop-color="#e3d3f1"/><stop offset=".16" stop-color="#8f78aa"/><stop offset=".38" stop-color="#514166"/>
      <stop offset=".67" stop-color="#251d35"/><stop offset="1" stop-color="#0c101b"/>
    </linearGradient>
    <linearGradient id="face" x1=".1" y1=".1" x2=".9" y2=".9">
      <stop stop-color="#aa92c7"/><stop offset=".25" stop-color="#5a4974"/><stop offset=".56" stop-color="#252136"/><stop offset="1" stop-color="#11121e"/>
    </linearGradient>
    <linearGradient id="beak" x1=".15" y1="0" x2=".75" y2="1">
      <stop stop-color="#f2d594"/><stop offset=".25" stop-color="#ba9355"/><stop offset=".48" stop-color="#785938"/><stop offset=".8" stop-color="#302727"/><stop offset="1" stop-color="#161720"/>
    </linearGradient>
    <radialGradient id="eye">
      <stop stop-color="#fff5c3"/><stop offset=".35" stop-color="#f9d16c"/><stop offset=".72" stop-color="#bd7734"/><stop offset="1" stop-color="#6a301f"/>
    </radialGradient>
    <filter id="depth" x="-35%" y="-35%" width="180%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="3" dy="9" result="shadow"/>
      <feComponentTransfer in="shadow" result="dark"><feFuncA type="linear" slope=".65"/></feComponentTransfer>
      <feMerge><feMergeNode in="dark"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <style>
    .crest { transform-origin: 160px 160px; animation: float 6s ease-in-out infinite; }
    .eye-glow { animation: pulse 4s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-3px); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { .crest, .eye-glow { animation: none; } }
  </style>
  <g class="crest" filter="url(#depth)">
    <path d="M160 15 278 51v99c0 65-48 114-118 154C90 264 42 215 42 150V51Z" fill="url(#rim)"/>
    <path d="M160 25 268 58v90c0 58-43 104-108 142C95 252 52 206 52 148V58Z" fill="url(#shield)" stroke="#14111d" stroke-width="4"/>
    <path d="M160 36 257 66v82c0 51-38 94-97 129-59-35-97-78-97-129V66Z" fill="none" stroke="#ad95c4" stroke-opacity=".5" stroke-width="2"/>
    <path d="M69 173c16 34 47 64 91 91 45-27 75-57 91-91" fill="none" stroke="#b48b55" stroke-opacity=".65" stroke-width="3"/>
    <!-- Sculpted feather layers form the neck and crest. -->
    <path d="M102 95 78 72l34 8-12-27 34 20 9-27 17 26c25-9 58-4 78 17 14 15 20 35 17 51l37 23-38 8c-5 34-27 59-57 67l-34 25-2-22-33 10 5-23-32 6 13-27-31 2 17-28-19-9 24-19Z" fill="#0c0d16" stroke="#b3a0c9" stroke-width="3" stroke-linejoin="round"/>
    <path d="m103 99-21-22 35 12-10-25 29 21 9-27 14 25c25-11 55-5 73 12 13 13 18 27 17 43l-23 16-21 39-41 30-45 8 15-24-34 3 19-25-24-4 24-18-11-12 21-22Z" fill="url(#head)"/>
    <path d="M139 92c22-14 59-17 83-1-24-3-47 4-65 19l-26 20-21-6Z" fill="#e1cfef" opacity=".45"/>
    <path d="M114 142c25-27 53-42 85-43 21 0 38 11 46 27l-15 38-31 37-41 31-37 6 17-24-25-1 19-21-24-4 22-18-19-8Z" fill="url(#face)"/>
    <path d="M124 170c31-25 63-35 93-31-16 8-29 17-40 29l-40 33-21 3 21-18-21-3Z" fill="#807099" opacity=".52"/>
    <path d="M132 213c31-4 58-20 79-43-15 25-35 43-59 54l-14 10 5-14-23 4Z" fill="#0b101b" opacity=".8"/>
    <path d="M231 120c12 7 28 17 47 28l15 13-43 5-20-10-18-19Z" fill="url(#beak)" stroke="#dec38a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="m250 151 31 9-29 2-17-7" fill="#201c20" opacity=".85"/>
    <path d="M215 133c7-9 17-13 30-10l-9 17-18 4-15-4Z" fill="#100e17" stroke="#a491b7" stroke-width="2"/>
    <ellipse class="eye-glow" cx="224" cy="134" rx="11" ry="9" fill="#f3a749" filter="url(#glow)"/>
    <ellipse cx="224" cy="134" rx="6" ry="5" fill="url(#eye)"/>
    <ellipse cx="225" cy="134" rx="2" ry="4" fill="#17121a"/>
    <circle cx="222" cy="132" r="1.5" fill="#fff9db"/>
    <path d="M139 112c12-9 27-16 42-19M126 136c19-15 40-24 62-27M134 154c17-11 36-17 55-19" fill="none" stroke="#e0cbed" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M99 187c-10 15-16 27-20 39M111 199c-8 14-13 26-15 36" fill="none" stroke="#b79ac9" stroke-opacity=".45" stroke-width="2"/>
  </g>
</svg>
